<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coleção · Le Sensier</title>
  <meta name="description" content="Todas as fragrâncias Le Sensier: autorais, releituras, kits de miniaturas e polpas para o corpo." />
  <meta name="theme-color" content="#F3F0EA" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="page-colecao">
  <main>
    <section class="shop shop--page wrap" aria-labelledby="shop-title">
      <header class="shop__head">
        <h1 id="shop-title" data-title>Perfumes</h1>
        <p class="shop__count" data-count></p>
      </header>
      <div class="shop__bar">
        <div class="chips" data-filters role="toolbar" aria-label="Filtrar"></div>
        <label class="shop__q"><span class="sr">Buscar</span><input type="search" data-q placeholder="Buscar nota ou nome" autocomplete="off" /></label>
      </div>
      <div class="grid" data-grid aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="/src/js/pages/colecao.js"></script>
</body>
</html>
