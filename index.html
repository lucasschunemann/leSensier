<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Sensier · Perfumaria brasileira</title>
  <meta name="description" content="Le Sensier: perfumaria brasileira com criações autorais e releituras. Linge, Brume, Sorbet, Brise, Soufflé, Douceur e Thé." />
  <meta name="theme-color" content="#F4F3F0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="home">
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__copy">
        <h1 id="hero-title" class="hero__title">Perfumaria brasileira. Criações autorais e releituras.</h1>
        <p class="hero__sub" data-hero-sub></p>
        <div class="hero__cta">
          <a class="btn btn--ink" href="#perfumes">Ver perfumes</a>
          <a class="btn" href="/colecao.html?f=kits">Kits de 5 ml</a>
        </div>
      </div>
      <div class="hero__stage">
        <canvas class="hero__gl" aria-hidden="true"></canvas>
        <div class="hero__fallback" aria-hidden="true"></div>
        <div class="hero__caption" aria-live="polite">
          <p class="hero__fam" data-hero-fam></p>
          <a class="hero__link" data-hero-link href="#"></a>
        </div>
      </div>
      <div class="hero__fams" role="tablist" aria-label="Famílias" data-hero-tabs></div>
    </section>

    <section class="shop wrap" id="perfumes" aria-labelledby="shop-title">
      <header class="shop__head">
        <h2 id="shop-title">Perfumes</h2>
        <p class="shop__count" data-count></p>
      </header>
      <div class="shop__bar">
        <div class="chips" data-filters role="toolbar" aria-label="Filtrar"></div>
        <label class="shop__q"><span class="sr">Buscar</span><input type="search" data-q placeholder="Buscar nota ou nome" autocomplete="off" /></label>
      </div>
      <div class="grid" data-grid aria-live="polite"></div>
    </section>

    <section class="lines wrap" aria-labelledby="lines-title">
      <h2 id="lines-title" class="lines__title" data-split>Autoral ou releitura</h2>
      <div class="lines__grid">
        <figure data-reveal>
          <div class="lines__img" data-bottle='{"family":"linge","line":"autoral","name":"Linge Lave"}'></div>
          <figcaption><strong>Autoral, tampa branca</strong>Fragrâncias criadas pela Le Sensier: Linge, Brume, Sorbet e Thé.</figcaption>
        </figure>
        <figure data-reveal=".08">
          <div class="lines__img" data-bottle='{"family":"souffle","line":"releitura","name":"Soufflé de Santal"}'></div>
          <figcaption><strong>Releitura, tampa preta</strong>Nossa versão de perfumes conhecidos: Brise, Soufflé e Douceur.</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <script type="module" src="/src/js/pages/home.js"></script>
</body>
</html>
